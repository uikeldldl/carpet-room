<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>12 Hour Timer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            /* White matching the background of your image */
            background-color: #ffffff;

            font-family: Arial, sans-serif;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;

            /* Moves everything slightly downward */
            transform: translateY(60px);
        }

        /* Image above the button */
        .image {
            width: 300px;
            max-width: 80vw;
            display: block;
            margin: 0 auto 35px auto;
        }

        /* Rectangle button */
        button {
            width: 280px;
            height: 80px;

            border: none;
            border-radius: 10px;

            background-color: #d62828;
            color: white;

            font-size: 26px;
            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #b91f1f;
            transform: scale(1.03);
        }

        button:disabled {
            cursor: default;
        }

        /* Timer */
        #timer {
            margin-top: 30px;

            font-size: 48px;
            font-weight: bold;

            display: none;
        }

        /* Finished message */
        #message {
            margin-top: 30px;

            font-size: 32px;
            font-weight: bold;

            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- YOUR IMAGE -->
        <img
            class="image"
            src="image.png"
            alt="Timer image"
        >

        <!-- START BUTTON -->
        <button id="startButton" onclick="startTimer()">
            START
        </button>

        <!-- TIMER -->
        <div id="timer">
            12:00:00
        </div>

        <!-- FINISHED MESSAGE -->
       <div id="message">
    Behind The Bench.
</div>

    </div>


    <script>
        let countdown;

        const twelveHours = 12 * 60 * 60 * 1000;

        function startTimer() {

            const startButton =
                document.getElementById("startButton");

            const timerDisplay =
                document.getElementById("timer");

            const message =
                document.getElementById("message");


            startButton.disabled = true;
            startButton.style.display = "none";

            timerDisplay.style.display = "block";
            message.style.display = "none";


            const endTime = Date.now() + twelveHours;


            countdown = setInterval(function() {

                const remaining =
                    endTime - Date.now();


                if (remaining <= 0) {

                    clearInterval(countdown);

                    timerDisplay.style.display = "none";

                    message.style.display = "block";

                    return;
                }


                const hours =
                    Math.floor(
                        remaining /
                        (1000 * 60 * 60)
                    );


                const minutes =
                    Math.floor(
                        (remaining %
                        (1000 * 60 * 60)) /
                        (1000 * 60)
                    );


                const seconds =
                    Math.floor(
                        (remaining %
                        (1000 * 60)) /
                        1000
                    );


                timerDisplay.textContent =
                    String(hours).padStart(2, "0") + ":" +
                    String(minutes).padStart(2, "0") + ":" +
                    String(seconds).padStart(2, "0");

            }, 1000);
        }
    </script>

</body>
</html>
