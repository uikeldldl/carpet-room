<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>Charlie</title>

    <!-- Browser tab icon -->
   <link rel="icon" type="image/jpeg" href="charlie.jpg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            /* White background */
            background-color: #ffffff;

            font-family: Arial, sans-serif;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;

            /* Moves everything slightly down */
            transform: translateY(60px);
        }

        /* Steak image */
        .image {
            width: 300px;
            max-width: 80vw;
            display: block;
            margin: 0 auto 35px auto;
        }

        /* Timer */
        #timer {
            font-size: 48px;
            font-weight: bold;
        }

        /* Finished message */
        #message {
            font-size: 40px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Steak image -->
      <img
    class="image"
    src="charlie.jpg"
    alt="Steak"
>

        <!-- Countdown -->
        <div id="timer">
            1:00:00
        </div>

        <!-- Message after countdown -->
        <div id="message">
            Behind The Bench.
        </div>

    </div>


    <script>

        // 12 hours in milliseconds
        const twelveHours = 12 * 60 * 60 * 1000;

        const timerDisplay =
            document.getElementById("timer");

        const message =
            document.getElementById("message");


        // Start the timer immediately when the website opens
        const endTime = Date.now() + twelveHours;


        function updateTimer() {

            const remaining =
                endTime - Date.now();


            // Timer finished
            if (remaining <= 0) {

                clearInterval(countdown);

                timerDisplay.style.display = "none";

                message.style.display = "block";

                return;
            }


            // Calculate remaining time
            const hours =
                Math.floor(
                    remaining /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (remaining %
                    (1000 * 60 * 60)) /
                    (1000 * 60)
                );


            const seconds =
                Math.floor(
                    (remaining %
                    (1000 * 60)) /
                    1000
                );


            // Display timer
            timerDisplay.textContent =
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }


        // Update immediately
        updateTimer();


        // Update every second
        const countdown =
            setInterval(updateTimer, 1000);

    </script>

</body>
</html>
