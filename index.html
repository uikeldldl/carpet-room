<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Charlie</title>

    <link rel="icon" type="image/jpeg" href="charlie.jpg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            transform: translateY(60px);
        }

        .image {
            width: 300px;
            max-width: 80vw;
            display: block;
            margin: 0 auto 35px auto;
        }

        #timer {
            font-size: 48px;
            font-weight: bold;
        }

        #message {
            font-size: 40px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            class="image"
            src="charlie.jpg"
            alt="Steak"
        >

        <div id="timer">
            01:00:00
        </div>

        <div id="message">
            Behind The Bench.
        </div>

    </div>

    <script>

        // 1 hour in milliseconds
        const oneHour = 1 * 60 * 60 * 1000;

        const timerDisplay =
            document.getElementById("timer");

        const message =
            document.getElementById("message");


        // Start the timer immediately when the website opens
        const endTime = Date.now() + oneHour;


        function updateTimer() {

            const remaining =
                endTime - Date.now();


            // Timer finished
            if (remaining <= 0) {

                clearInterval(countdown);

                timerDisplay.style.display = "none";

                message.style.display = "block";

                return;
            }


            // Calculate remaining time
            const hours =
                Math.floor(
                    remaining /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (remaining %
                    (1000 * 60 * 60)) /
                    (1000 * 60)
                );


            const seconds =
                Math.floor(
                    (remaining %
                    (1000 * 60)) /
                    1000
                );


            // Display timer
            timerDisplay.textContent =
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }


        // Update immediately
        updateTimer();


        // Update every second
        const countdown =
            setInterval(updateTimer, 1000);

    </script>

</body>
</html>
